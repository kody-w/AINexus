name: Ghost Host (retired) - invite model guard

# THIS WORKFLOW NO LONGER HOSTS ANYTHING, AND CANNOT.
#
# It used to open `index.html?host=nexus-permanent-world` in Puppeteer every 6 hours and
# claim to keep a permanent room alive. Since the secure-invite change (`net/multiplayer.js`)
# that URL is an error path: the page prints "This invite link is from an older version",
# ignores the id entirely, and hosts a brand-new random room that nobody has the secret for.
# The cron passed anyway - six hours of a headless browser talking to no one, green.
#
# A fixed-URL room is not expressible at all now:
#   * `new Peer()` takes no id, so the room id is whatever the signaling server assigns
#   * the room secret is minted per session with `crypto.getRandomValues`
#   * the host's tab IS the room - it dies with the tab (and an Actions job caps at 6h)
# So there is nothing to schedule. The schedule is gone rather than lying on a timer.
#
# What is left is an oracle: if the invite model ever gains a stable room id or a preset
# secret, ghost hosting becomes possible again and this file should be rewritten (along with
# the Multiplayer section of CLAUDE.md). Until then, running it on purpose fails loudly.

on:
  push:
    paths:
      - 'net/multiplayer.js'
      - '.github/workflows/ghost-host.yml'
  workflow_dispatch:

jobs:
  ghost-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manual run - there is no room to keep alive
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "::error title=Ghost host is retired::Rooms cannot be pinned to a URL. A host's room id is assigned by the PeerJS server and its secret is minted per session, so no fixed link can be hosted or joined. See CLAUDE.md, section Multiplayer."
          exit 1

      - name: The retirement premise still holds
        run: |
          set -euo pipefail
          f=net/multiplayer.js
          fail() { echo "::error title=Invite model changed::$1 Ghost hosting may be expressible again - rewrite .github/workflows/ghost-host.yml and the Multiplayer section of CLAUDE.md."; exit 1; }

          grep -q 'invite link is from an older version' "$f" \
            || fail "The legacy ?host= link is no longer refused."
          grep -q 'crypto.getRandomValues' "$f" \
            || fail "The room secret is no longer minted per session."
          if grep -nE 'new Peer\([^)]' "$f"; then
            fail "A peer is now constructed with an id, so a room id may be choosable."
          fi

          echo "Ghost hosting remains impossible: room id is server-assigned, secret is per-session, room dies with the host tab."
