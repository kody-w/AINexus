name: Fingerprints

# Hot-loading an agent VERIFIES it against state/agent_templates.json and refuses
# bytes that do not match, which is the protection learn.html promises a stranger
# reading the page. The forge does the same for the world templates in
# state/worlds.json.
#
# That protection has a cost, and this workflow is the cost: a fingerprint left
# stale by an ordinary edit no longer fails soft. It REFUSES the agent, and the
# capability disappears for everyone, for a reason nobody edited anything to
# cause. Editing index.html without rebuilding state/worlds.json is enough.
#
# So the registries are checked on every push that touches a file they cover, and
# the spec's own tables are checked against the vectors they claim to describe.
# A red run here is the system working.

on:
  push:
    branches: [main]
    paths:
      - 'ai/vb/**.py'
      - '**.html'
      - 'state/agent_templates.json'
      - 'state/worlds.json'
      - 'WEARING.md'
      - 'WEARING-VECTORS.json'
      - 'tools/check_registries.py'
      - 'tools/check_portable.py'
      - 'tests/**'
      - 'tools/check_spec_tables.cjs'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }

      - name: nothing is anchored to one machine
        # A test carrying an absolute path to its author's laptop passed here and could not have
        # passed anywhere — and stayed green for days because only that laptop ever ran it.
        run: python3 tools/check_portable.py

      - name: every suite is gated or accounted for
        # A suite can fall out of CI in silence — nobody adds it to the gate, nobody says why —
        # and then it looks like part of a passing build while running nowhere.
        run: python3 tools/check_gate_covers.py

      - name: every suite is in the inventory
        # The table in tests/browser/README.md went stale twice: once with five suites missing,
        # and again with the two written the same night the first gap was fixed. A list humans
        # maintain and nothing checks is a list that is wrong.
        run: |
          missing=""
          for f in tests/browser/*.cjs; do
            grep -q "$(basename "$f")" tests/browser/README.md || missing="$missing $(basename "$f")"
          done
          if [ -n "$missing" ]; then
            echo "::error::not in tests/browser/README.md:$missing"
            exit 1
          fi
          echo "all $(ls tests/browser/*.cjs | wc -l | tr -d ' ') suites are in the inventory"

      - name: every published fingerprint matches its file
        run: python3 tools/check_registries.py

      - name: the registries are what the builders would produce
        # check_registries.py verifies every ROW against its file, which cannot see a world that
        # was added and never registered — the forge would simply never offer it, silently. Running
        # the builders and diffing catches additions, removals and content drift in one move.
        run: |
          python3 tools/build_world_registry.py > /dev/null
          python3 tools/build_agent_registry.py > /dev/null
          if ! git diff --quiet -- state/worlds.json state/agent_templates.json; then
            echo "::error::a registry is stale — run tools/build_world_registry.py and tools/build_agent_registry.py and commit the result"
            git --no-pager diff --stat -- state/worlds.json state/agent_templates.json
            exit 1
          fi
          echo "both registries are up to date"

      - name: WEARING.md still describes its own vectors
        run: node tools/check_spec_tables.cjs

      - name: every frame on disk is rapp/1 conformant
        # Reports only. 101 legacy frames carry body.* kinds on non-conformant
        # streams; §12.1 re-genesis is owner-authorized and needs a signature.
        # frames/line.jsonl is the clean line and IS enforced, below.
        run: python3 tools/check_rapp1.py || true

      - name: the compliant line verifies
        run: python3 frames/verify.py frames/line.jsonl
