name: Suites

# Excluded on TIME, because each downloads ~10MB of Pyodide, not on importance — named rather
# than counted, so the list can be checked instead of trusted:
#   chat_tile ensemble forge herd hotload slosh spiral time_travel vbrainstem_python world_frame
#   agent_contract
# Excluded because a THIRD PARTY would decide the build: copilot_auth (a live rate-limited
# endpoint), room and holo_wire (a real PeerJS room through the public signalling server).
#
# dimension_seed is back. It hardcoded an absolute path to one laptop's scratchpad, so everywhere
# else every file 404'd and the page loaded with no scripts at all.
#
# room.cjs and holo_wire.cjs are out for the same reason copilot_auth is: they drive a REAL
# PeerJS room through the public signalling server, so a third party's availability would decide
# whether this build is green. Both are real suites — room.cjs holds 18 checks over four browser
# contexts — and both run in the local sweep. agent_contract.cjs is out on time: it loads Pyodide.
#
# orbs_and_gaze is BACK, and the runner was right all along. It settled at dead centre because
# readFace locked its gaze origin after a fixed NUMBER of frames, and while settling it recomputes
# the origin from the current pose every frame — so the deflection is exactly 0.5 by construction
# and the pointer cannot move. Twenty frames is a third of a second at 60fps and four seconds at
# five. Worse, when the count ran out whatever pose was current BECAME the origin, so on a slow
# machine "looking right" was learned as straight ahead and the pointer read centre for the rest of
# the session — for someone using their face as their pointer, the input dying in silence.
# Settling is a length of time now. The suite passes unmodified; nothing was loosened.
#
# Run everything locally with:

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'ai/**'
      - 'net/**'
      - 'tests/browser/**'
      - 'tools/run_suites.cjs'
      - 'proof/latest/**'
      - '.github/workflows/suites.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: suites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }

      - name: install playwright + chromium
        working-directory: tests
        run: |
          # ONE playwright, chosen by tests/package.json and used for everything. Pinning
          # playwright@1.55.1 here while package.json asked for @playwright/test ^1.40.0 gave two:
          # the CLI installed chromium for 1.57.0 while the suites loaded a different copy, and
          # every suite died on "Executable doesn't exist" with the browser sitting right there.
          npm install --no-audit --no-fund
          ./node_modules/.bin/playwright install --with-deps chromium
          # and prove they are the same one, so this cannot come back quietly
          CLI=$(./node_modules/.bin/playwright --version | awk '{print $2}')
          LIB=$(node -e "console.log(require('playwright/package.json').version)")
          echo "playwright CLI $CLI · library $LIB"
          if [ "$CLI" != "$LIB" ]; then
            echo "::error::the playwright that installed the browsers ($CLI) is not the one the suites load ($LIB)"
            exit 1
          fi

      - name: the code still produces the published wearing vectors
        # check_spec_tables.cjs holds WEARING.md to WEARING-VECTORS.json, and nothing held the
        # CODE to them — so changing the draw order or the keystream in wear() left every gate in
        # this repo green: the document and the vectors still agreed with each other, and nothing
        # recomputed a tile. This is the other half, and it is the half that matters.
        env:
          PLAYWRIGHT_DIR: ${{ github.workspace }}/tests
        run: node tools/check_vectors.cjs

      - name: run the suites that do not need Pyodide
        env:
          PLAYWRIGHT_DIR: ${{ github.workspace }}/tests
        run: |
          node tools/run_suites.cjs \
            dialogue_ring dimension_seed holo_calibration orbs_and_gaze overlay \
            proof_red tick_loop tiles turn views_live tick_seal_on_error slow_frames \
            frames_conformance absent_and_infinite autodrive_hands absent_and_infinite \
            token_path peer_errors
